name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk PrivacyGlass.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyGlass-apk
          path: PrivacyGlass.apk
      # A rolling pre-release per branch, so the APK can be downloaded straight from a phone.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" PrivacyGlass.apk --prerelease --target "$GITHUB_SHA" \
            --title "Privacy Glass ($GITHUB_REF_NAME)" \
            --notes "Built from ${GITHUB_SHA::7}. Install PrivacyGlass.apk on your phone."
